# Example only: adapt TLS, authentication, rate limits, paths, and upstream address.
# Keep the gateway key on the server. Never include it in frontend JavaScript.

location = /timeline/api/records {
    auth_basic "Private Timeline";
    auth_basic_user_file /etc/nginx/auth/timeline.htpasswd;
    proxy_set_header Authorization "Bearer REPLACE_WITH_XIAOKE_API_KEY";
    proxy_pass http://127.0.0.1:3010/internal/timeline;
}

# Repeat the same browser authentication and server-side Authorization header for:
# /timeline/api/dates      -> /internal/timeline/dates
# /timeline/api/day        -> /internal/timeline/day
# /timeline/api/search     -> /internal/timeline/search
# /timeline/api/favorites  -> /internal/timeline/favorites
# /timeline/api/records/<id>/favorite -> /internal/timeline/records/<id>/favorite
# /timeline/api/records/<id>          -> /internal/timeline/records/<id>

location /timeline/ {
    auth_basic "Private Timeline";
    auth_basic_user_file /etc/nginx/auth/timeline.htpasswd;
    alias /path/to/xiaoke/frontend/timeline/;
    index index.html;
}
