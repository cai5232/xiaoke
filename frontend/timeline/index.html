<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>xiaoke · Shared Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/timeline/style.css?v=actions2"></head><body><div class="sky" aria-hidden="true"><i class="moon"></i><i class="orb o1"></i><i class="orb o2"></i></div><main><header class="hero"><p class="eyebrow">XIAOKE · SHARED TIMELINE</p><h1>共同时间线</h1><p class="subtitle">每一段对话，都留在同一条时间线里。</p></header><section class="full-calendar" id="calendar" aria-label="时间线日期导航"><div class="month-head"><button id="month-prev" aria-label="上一个月">‹</button><div><b id="month-title">记录日期</b><small id="calendar-count">正在整理…</small></div><button id="month-next" aria-label="下一个月">›</button></div><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="month-grid" id="calendar-months"></div></section><div class="toolbar"><div class="filters"><button class="active" data-role="all">全部</button><button data-role="user">用户</button><button data-role="assistant">助手</button><button data-role="event">事件</button><button data-role="favorite">收藏</button></div></div><form id="search" class="search"><input id="search-q" placeholder="搜索这条河里的话…" autocomplete="off"><button type="submit">搜索</button><button type="button" id="search-clear" hidden>清除</button></form><section class="reading-status" id="status">正在打开这条河…</section><section id="timeline"></section><button id="older" class="older" hidden>加载更早的记忆</button></main><div id="floating-controls" popover="manual" aria-live="polite"><button id="latest" class="latest" hidden>回到最新　↑</button></div><dialog id="delete-dialog"><form method="dialog"><h2>永久删除这条记录？</h2><p>这会从共享时间线永久移除该记录，它不会再被注入后续对话。此操作无法恢复。</p><div class="dialog-actions"><button value="cancel">取消</button><button id="delete-confirm" value="default">确认永久删除</button></div></form></dialog><template id="day"><div class="day-divider"><span></span><time></time><span></span></div></template><template id="card"><article class="record"><div class="meta"><span class="role"></span><span class="source"></span><time></time><span class="seq"></span><button class="favorite" title="收藏">♡</button><button class="delete" title="永久删除">×</button></div><div class="content"></div></article></template><script src="/timeline/app.js"></script></body></html>
